# hpc-bridge fake cluster — cgroup.conf. Slurm 23.11's slurmd initialises the cgroup plugin
# unconditionally (even with task/none + proctrack/linuxproc), and cgroup/v2's init wants a systemd
# dbus scope, which a plain container hasn't got -> "slurmd initialization failed". Ubuntu's 23.11
# build has no `disabled` plugin (that's 24.05+), so pin cgroup/v1: its init is a no-op and nothing
# in our slurm.conf consumes cgroups (no resource confinement — fine for a functional test cluster).
CgroupPlugin=cgroup/v1
